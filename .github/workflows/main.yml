name: Générer l'APK TOM_TUNNEL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.10.2"
  XRAY_VERSION: "v26.10.21"
  HEV_VERSION: "2.19.1"
  HYSTERIA_VERSION: "1.3.5"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix project structure
        shell: bash
        run: |
          set -eu
          mkdir -p app/libs \
                   app/src/main/jniLibs/arm64-v8a \
                   app/src/main/jniLibs/x86_64
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -eu
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" \
                  "platforms;android-34" \
                  "platforms;android-35" \
                  "build-tools;34.0.0" \
                  "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Bootstrap native engines (Xray + hev + DNSTT + Hysteria)
        shell: bash
        run: |
          set -euo pipefail

          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          LIBS="$GITHUB_WORKSPACE/app/libs"
          TMP="$RUNNER_TEMP/engines"
          mkdir -p "$JNI/arm64-v8a" "$JNI/x86_64" "$LIBS" "$TMP"

          dl() {
            local url="$1" out="$2" i
            for i in 1 2 3 4 5; do
              echo "→ Téléchargement ($i/5) : $url"
              if curl -fL --connect-timeout 25 --max-time 360 -o "$out" "$url"; then
                [ -s "$out" ] && return 0
              fi
              echo "Échec ($i/5)" >&2
              sleep 5
            done
            echo "ÉCHEC définitif : $url" >&2
            return 1
          }

          latest_tag() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$1/releases/latest" \
              | grep -m1 '"tag_name"' \
              | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/'
          }

          ########################################
          # 1) hev-socks5-tunnel (TUN)
          ########################################
          echo "=== hev-socks5-tunnel ==="
          HEV_URL="https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/hev-socks5-tunnel.aar"
          if ! dl "$HEV_URL" "$LIBS/hev-socks5-tunnel.aar"; then
            T="$(latest_tag heiher/hev-socks5-tunnel)"
            echo "Repli hev → $T"
            dl "https://github.com/heiher/hev-socks5-tunnel/releases/download/${T}/hev-socks5-tunnel.aar" \
               "$LIBS/hev-socks5-tunnel.aar"
          fi
          unzip -tq "$LIBS/hev-socks5-tunnel.aar" >/dev/null
          echo "hev OK ($(du -h "$LIBS/hev-socks5-tunnel.aar" | cut -f1))"

          ########################################
          # 2) Xray-core
          ########################################
          echo "=== Xray-core ==="
          get_xray() {
            local asset="$1" abi="$2" ver="$XRAY_VERSION"
            local base="https://github.com/XTLS/Xray-core/releases/download"
            if ! dl "$base/$ver/$asset" "$TMP/$asset"; then
              ver="$(latest_tag XTLS/Xray-core)"
              echo "Repli Xray → $ver"
              dl "$base/$ver/$asset" "$TMP/$asset"
            fi
            unzip -tq "$TMP/$asset" >/dev/null
            unzip -p "$TMP/$asset" xray > "$JNI/$abi/libxray.so"
            chmod 755 "$JNI/$abi/libxray.so"
            echo "Xray $abi → $(du -h "$JNI/$abi/libxray.so" | cut -f1)"
          }
          get_xray "Xray-android-arm64-v8a.zip" "arm64-v8a"
          get_xray "Xray-android-amd64.zip"     "x86_64"

          ########################################
          # 3) DNSTT (SlowDNS)
          ########################################
          echo "=== DNSTT ==="
          rm -rf "$TMP/dnstt_xyz_app"
          git clone --depth 1 https://github.com/dnstt-xyz/dnstt_xyz_app.git "$TMP/dnstt_xyz_app"

          CLIENT_DIR="$TMP/dnstt_xyz_app/go_src/dnstt-client"
          if [ -f "$CLIENT_DIR/go.mod" ]; then
            MOD_DIR="$CLIENT_DIR"
          else
            MOD_DIR="$TMP/dnstt_xyz_app/go_src"
          fi
          [ -f "$MOD_DIR/go.mod" ] || { echo "go.mod introuvable" >&2; exit 1; }

          if [ "$CLIENT_DIR" = "$MOD_DIR" ]; then
            REL="."
          else
            REL="./${CLIENT_DIR#"$MOD_DIR"/}"
          fi
          echo "Module Go : $MOD_DIR (paquet $REL)"

          cd "$MOD_DIR"

          echo "Build dnstt-client arm64..."
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o "$JNI/arm64-v8a/libdnstt.so" "$REL"
          chmod 755 "$JNI/arm64-v8a/libdnstt.so"
          test -s "$JNI/arm64-v8a/libdnstt.so" || { echo "Échec DNSTT arm64" >&2; exit 1; }

          echo "Build dnstt-client amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o "$JNI/x86_64/libdnstt.so" "$REL"
          chmod 755 "$JNI/x86_64/libdnstt.so"
          test -s "$JNI/x86_64/libdnstt.so" || { echo "Échec DNSTT amd64" >&2; exit 1; }

          echo "DNSTT OK"

          ########################################
          # 4) Hysteria v1 (UDP / ZiVPN) — URL CORRIGÉE
          ########################################
          echo "=== Hysteria v1 ==="
          # IMPORTANT : tag = v1.3.5  (PAS app/v1.3.5)
          dl "https://github.com/apernet/hysteria/releases/download/v${HYSTERIA_VERSION}/hysteria-linux-arm64" \
             "$JNI/arm64-v8a/libhysteria.so"
          dl "https://github.com/apernet/hysteria/releases/download/v${HYSTERIA_VERSION}/hysteria-linux-amd64" \
             "$JNI/x86_64/libhysteria.so"
          chmod 755 "$JNI/arm64-v8a/libhysteria.so" "$JNI/x86_64/libhysteria.so"
          echo "Hysteria OK"

          cd "$GITHUB_WORKSPACE"

          ########################################
          # Vérification finale
          ########################################
          echo "=== Vérification des binaires natifs ==="
          for f in \
            "$JNI/arm64-v8a/libxray.so" \
            "$JNI/arm64-v8a/libdnstt.so" \
            "$JNI/arm64-v8a/libhysteria.so" \
            "$JNI/x86_64/libxray.so" \
            "$JNI/x86_64/libdnstt.so" \
            "$JNI/x86_64/libhysteria.so"
          do
            [ -s "$f" ] || { echo "MANQUANT : $f" >&2; exit 1; }
            echo "  $(du -h "$f" | cut -f1)  $f"
            file "$f" || true
          done
          ls -la "$LIBS"
          echo "Tous les moteurs sont prêts."

      - name: Auto-fix Gradle config
        shell: bash
        run: |
          set -eu
          touch gradle.properties
          grep -q '^org.gradle.jvmargs' gradle.properties || \
            echo 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' >> gradle.properties
          grep -q '^android.useAndroidX' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^kotlin.code.style' gradle.properties || \
            echo 'kotlin.code.style=official' >> gradle.properties
          grep -q '^android.nonTransitiveRClass' gradle.properties || \
            echo 'android.nonTransitiveRClass=true' >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -eo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi
          "$GRADLE" --version
          "$GRADLE" --no-daemon --stacktrace --console=plain :app:assembleDebug \
            2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          echo "## Erreurs Gradle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 25 -E 'What went wrong|FAILURE:|error:|^e: |AAPT|Unresolved reference|Could not resolve' "$LOG" \
            | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 15 -E 'What went wrong|FAILURE:|error:|^e: ' "$LOG" | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload log Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: ignore