name: Build TOM TUNNEL Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      HYST_TAG: v1.3.5
      ANDROID_API: "24"

    steps:

      # 1. SOURCE
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. JAVA 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. GO 1.24 FOR DNSTT
      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. ANDROID NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"

          yes | sdkmanager --licenses >/dev/null || true

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      # 6. GO 1.20.14 FOR HYSTERIA
      - name: Install Go 1.20.14
        shell: bash
        run: |
          set -euo pipefail

          GO_DIR="$RUNNER_TEMP/go1.20.14"

          mkdir -p "$GO_DIR"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            https://go.dev/dl/go1.20.14.linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/go1.20.14.tar.gz"

          tar -xzf "$RUNNER_TEMP/go1.20.14.tar.gz" \
            -C "$GO_DIR" \
            --strip-components=1

          "$GO_DIR/bin/go" version

          echo "HYST_GO=$GO_DIR/bin/go" >> "$GITHUB_ENV"

      # 7. GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 8. DEPENDENCIES
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            git \
            jq \
            unzip \
            zip \
            file \
            binutils \
            build-essential \
            python3

      # 9. VERIFY COMPILERS
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          go version
          "$HYST_GO" version

          test -d "$ANDROID_NDK_HOME"

          test -f script/bootstrap-engines.sh
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

          echo "Build environment ready."

      # 10. VALIDATE HYSTERIA
      - name: Verify Hysteria source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$HYST_TAG" \
            https://github.com/apernet/hysteria.git \
            "$RUNNER_TEMP/hysteria-check"

          test -f "$RUNNER_TEMP/hysteria-check/app/go.mod"
          test -f "$RUNNER_TEMP/hysteria-check/app/cmd/main.go"

          echo "Hysteria source validated."

      # 11. PREPARE
      - name: Prepare native directories
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

          chmod +x script/bootstrap-engines.sh

      # 12. BUILD ENGINES
      - name: Build VPN native engines
        shell: bash
        run: |
          set -euo pipefail

          bash script/bootstrap-engines.sh

      # 13. VERIFY ENGINES
      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do

              FILE="app/src/main/jniLibs/$ABI/lib$ENGINE.so"

              test -s "$FILE"

              echo "Verified: $FILE"
              file "$FILE"
              readelf -h "$FILE" >/dev/null

            done
          done

          test -s app/libs/hev-socks5-tunnel.aar

      # 14. BUILD APK
      - name: Compile TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:clean \
            :app:assembleDebug

      # 15. VERIFY APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK" | head -n 10

      # 16. PREPARE RELEASE
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/TOM-TUNNEL.apk

          sha256sum release/TOM-TUNNEL.apk \
            > release/SHA256SUMS.txt

      # 17. UPLOAD
      - name: Upload TOM TUNNEL APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-ANDROID-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # 18. PUBLISH
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # 19. SUMMARY
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TOM TUNNEL BUILD"
            echo ""
            echo "- Java: 17"
            echo "- DNSTT Go: 1.24"
            echo "- Hysteria Go: 1.20.14"
            echo "- Hysteria: $HYST_TAG"
            echo "- Android API: 34"
            echo "- NDK: 27.2.12479018"
          } >> "$GITHUB_STEP_SUMMARY"