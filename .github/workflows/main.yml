name: Build TOM_TUNNEL_VPN

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      HYST_TAG: v1.3.5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            unzip \
            zip \
            jq \
            build-essential \
            file \
            binutils \
            python3

      - name: Permissions
        run: |
          chmod +x gradlew
          chmod +x script/bootstrap-engines.sh

      - name: Prepare folders
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

      - name: Build VPN Engines
        run: |
          bash script/bootstrap-engines.sh

      - name: Verify native libraries
        run: |
          test -s app/libs/hev-socks5-tunnel.aar
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so
          test -s app/src/main/jniLibs/arm64-v8a/libdnstt.so
          test -s app/src/main/jniLibs/arm64-v8a/libhysteria.so

      - name: Clean
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Bundle
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Verify outputs
        run: |
          ls -R app/build/outputs/

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL_DEBUG
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL_RELEASE
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL_AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: GitHub Release
        if: startsWith(github.ref,'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Summary
        if: always()
        run: |
          echo "## TOM_TUNNEL Build Finished" >> $GITHUB_STEP_SUMMARY
          echo "- AGP 8.5.2" >> $GITHUB_STEP_SUMMARY
          echo "- Kotlin 1.9.24" >> $GITHUB_STEP_SUMMARY
          echo "- compileSdk 34" >> $GITHUB_STEP_SUMMARY
          echo "- targetSdk 34" >> $GITHUB_STEP_SUMMARY
          echo "- minSdk 29" >> $GITHUB_STEP_SUMMARY