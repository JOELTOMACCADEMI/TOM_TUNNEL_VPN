name: Build TOM TUNNEL APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Android SDK (plateforme 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Gradle 8.7 (AGP 8.5.2 / Kotlin 1.9.24)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # Crée le script de bootstrap (version propre, sans indentation)
      # ============================================================
      - name: Assurer la présence de scripts/bootstrap-engines.sh
        run: |
          mkdir -p scripts
          cat > scripts/bootstrap-engines.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="\( (cd " \)(dirname "$0")/.." && pwd)"
          LIBS="$ROOT/app/libs"
          JNI="$ROOT/app/src/main/jniLibs"
          TMP="${TMPDIR:-/tmp}/tomtunnel-engines"
          mkdir -p "$LIBS" "$JNI/arm64-v8a" "$JNI/x86_64" "$TMP"
          HEV=2.18.0
          XRAY=26.9.8
          DNSTT_REPO=https://github.com/dnstt-xyz/dnstt_xyz_app.git

          need(){ command -v "$1" >/dev/null 2>&1 || { echo "Missing: $1" >&2; exit 1; }; }
          need curl; need unzip; need git; need go

          if [ ! -s "$LIBS/hev-socks5-tunnel.aar" ]; then
            curl -fL --retry 3 "https://github.com/heiher/hev-socks5-tunnel/releases/download/$HEV/hev-socks5-tunnel.aar" -o "$LIBS/hev-socks5-tunnel.aar"
          fi
          test -s "$LIBS/hev-socks5-tunnel.aar"

          fetch_xray(){
            local abi="$1" file="$2"
            local zip="$TMP/$file.zip" out="$JNI/$abi/libxray.so"
            if [ -s "$out" ]; then echo "Xray $abi déjà présent"; return; fi
            curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/v$XRAY/$file.zip" -o "$zip"
            unzip -p "$zip" xray > "$out"
            chmod 755 "$out"
            test -s "$out"
          }
          fetch_xray arm64-v8a Xray-android-arm64-v8a
          fetch_xray x86_64 Xray-android-amd64

          SRC="$TMP/dnstt_xyz_app"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 "$DNSTT_REPO" "$SRC"
          else
            git -C "$SRC" fetch --depth 1 origin >/dev/null 2>&1 || true
            git -C "$SRC" reset --hard FETCH_HEAD >/dev/null 2>&1 || true
          fi

          CLIENT_DIR="$SRC/go_src/dnstt-client"
          [ -d "$CLIENT_DIR" ] || { echo "ERREUR: dossier go_src/dnstt-client introuvable dans $SRC" >&2; exit 1; }

          MOD_DIR="$CLIENT_DIR"
          while [ "$MOD_DIR" != "$SRC" ] && [ "$MOD_DIR" != "/" ] && [ ! -f "$MOD_DIR/go.mod" ]; do
            MOD_DIR="$(dirname "$MOD_DIR")"
          done
          if [ ! -f "$MOD_DIR/go.mod" ]; then
            FOUND="$(find "$SRC" -name go.mod -not -path '*/node_modules/*' | head -n1)"
            [ -n "$FOUND" ] || { echo "ERREUR: aucun go.mod trouvé dans $SRC" >&2; exit 1; }
            MOD_DIR="$(dirname "$FOUND")"
          fi
          REL="${CLIENT_DIR#"\( MOD_DIR"}"; REL=" \){REL#/}"
          PKG="./${REL}"; [ -n "$REL" ] || PKG="."
          echo "Module Go : $MOD_DIR  (paquet $PKG)"

          build_dnstt(){
            local goarch="$1" abi="$2"
            local out="$JNI/$abi/libdnstt.so"
            if [ -s "$out" ]; then echo "DNSTT $abi déjà présent"; return; fi
            local goos
            for goos in android linux; do
              if (cd "$MOD_DIR" && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$out.tmp" "$PKG"); then
                echo "DNSTT $abi compilé (GOOS=$goos)"
                mv "$out.tmp" "$out"
                chmod 755 "$out"
                test -s "$out"
                return
              fi
              rm -f "$out.tmp"
            done
            echo "ERREUR: compilation DNSTT impossible pour $abi" >&2
            exit 1
          }
          build_dnstt arm64 arm64-v8a
          build_dnstt amd64 x86_64

          HYST_TAG="${HYST_TAG:-v1.3.5}"
          HYST_SRC="$TMP/hysteria-v1"
          build_hysteria(){
            local goarch="$1" abi="$2"
            local out="$JNI/$abi/libhysteria.so"
            if [ -s "$out" ]; then echo "Hysteria $abi déjà présent"; return; fi
            if [ ! -d "$HYST_SRC/.git" ]; then
              git clone --depth 1 --branch "$HYST_TAG" https://github.com/apernet/hysteria.git "$HYST_SRC"
            fi
            local goos
            for goos in android linux; do
              if (cd "$HYST_SRC" && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "$out.tmp" ./cmd); then
                echo "Hysteria $abi compilé (GOOS=$goos)"
                mv "$out.tmp" "$out"
                chmod 755 "$out"
                test -s "$out"
                return
              fi
              rm -f "$out.tmp"
            done
            echo "ERREUR: compilation Hysteria impossible pour $abi" >&2
            exit 1
          }
          build_hysteria arm64 arm64-v8a
          build_hysteria amd64 x86_64

          rm -rf "$ROOT/app/src/main/assets/engines"

          printf '\nEngine bootstrap complete.\n'
          printf 'Native engines:\n'
          find "$JNI" -maxdepth 2 -type f -printf '  %p (%s bytes)\n' | sort
          printf 'AAR: %s\n' "$LIBS/hev-socks5-tunnel.aar"
          EOF

          # Nettoyage des espaces de début de ligne (problème classique YAML)
          sed -i 's/^[[:space:]]*//' scripts/bootstrap-engines.sh
          chmod +x scripts/bootstrap-engines.sh
          head -n 5 scripts/bootstrap-engines.sh
          echo "--- script OK ---"

      - name: Cache des moteurs natifs
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
          key: engines-${{ hashFiles('scripts/bootstrap-engines.sh') }}

      - name: Télécharger / compiler les moteurs
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/bootstrap-engines.sh
          ./scripts/bootstrap-engines.sh

      - name: Vérifier la présence des moteurs
        run: |
          ls -l app/libs/*.aar
          for abi in arm64-v8a x86_64; do
            for lib in libxray.so libdnstt.so libhysteria.so; do
              test -s "app/src/main/jniLibs/$abi/$lib" || { echo "Manquant : $abi/$lib"; exit 1; }
            done
          done

      - name: Chemin du SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Compiler l'APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Compiler l'APK release signé
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/tomtunnel.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/tomtunnel.jks" gradle --no-daemon :app:assembleRelease

      - name: Nommer les APK
        id: name
        run: |
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TomTunnel-$VERSION-debug.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "dist/TomTunnel-$VERSION-release.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: TomTunnel-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publier dans la Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk