
name: Build TOM TUNNEL Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      JAVA_VERSION: "17"
      GO_VERSION: "1.24.x"
      GRADLE_VERSION: "8.7"
      ANDROID_API: "34"
      BUILD_TOOLS: "34.0.0"
      NDK_VERSION: "27.2.12479018"
      HYST_TAG: "v1.3.5"

    steps:

      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. JAVA
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. GO
      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. INSTALL ANDROID NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"

          yes | sdkmanager --licenses >/dev/null || true

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      # 6. VALIDATE ENVIRONMENT
      - name: Validate build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          go version
          gradle --version || true

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -f script/bootstrap-engines.sh

          test -d "$ANDROID_NDK_HOME"

          echo "Environment validated."

      # 7. BUILD DEPENDENCIES
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            zip \
            git \
            jq \
            file \
            binutils \
            build-essential \
            ca-certificates \
            python3

      # 8. GRADLE
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 9. GO MODULE CACHE
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: tom-tunnel-go-${{ runner.os }}-${{ hashFiles('script/bootstrap-engines.sh') }}
          restore-keys: |
            tom-tunnel-go-${{ runner.os }}-

      # 10. VALIDATE HYSTERIA SOURCE
      - name: Validate Hysteria release structure
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$HYST_TAG" \
            https://github.com/apernet/hysteria.git \
            /tmp/hysteria-check

          test -f /tmp/hysteria-check/app/go.mod
          test -f /tmp/hysteria-check/app/cmd/main.go

          echo "Hysteria source validated."

      # 11. PREPARE DIRECTORIES
      - name: Prepare native directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

          chmod +x script/bootstrap-engines.sh

      # 12. BUILD ALL VPN ENGINES
      - name: Build VPN native engines
        shell: bash
        env:
          HYST_TAG: v1.3.5
          ANDROID_API: "24"
        run: |
          set -euo pipefail

          bash script/bootstrap-engines.sh

      # 13. VERIFY ENGINE FILES
      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "app/libs/hev-socks5-tunnel.aar"

            "app/src/main/jniLibs/arm64-v8a/libxray.so"
            "app/src/main/jniLibs/arm64-v8a/libdnstt.so"
            "app/src/main/jniLibs/arm64-v8a/libhysteria.so"

            "app/src/main/jniLibs/x86_64/libxray.so"
            "app/src/main/jniLibs/x86_64/libdnstt.so"
            "app/src/main/jniLibs/x86_64/libhysteria.so"
          )

          for f in "${REQUIRED_FILES[@]}"; do
            test -s "$f"
            echo "OK: $f"
          done

      # 14. VERIFY ARCHITECTURES
      - name: Verify Android architectures
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do

              FILE="app/src/main/jniLibs/$ABI/lib$ENGINE.so"

              echo "Checking $FILE"

              file "$FILE"
              readelf -h "$FILE"

            done
          done

      # 15. BUILD APK
      - name: Build TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:clean \
            :app:assembleDebug

      # 16. VERIFY APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo "APK successfully generated."

          ls -lh "$APK"

      # 17. PREPARE APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n \
            's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -n1)

          VERSION="${VERSION:-dev}"

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "release/TOM_TUNNEL-${VERSION}-debug.apk"

          sha256sum release/*.apk > release/SHA256SUMS.txt

          ls -lh release/

      # 18. UPLOAD ARTIFACT
      - name: Upload TOM TUNNEL APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-ANDROID-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # 19. PUBLISH RELEASE
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

      # 20. BUILD SUMMARY
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "=================================="
          echo "       TOM TUNNEL APK"
          echo "=================================="
          echo "Java: 17"
          echo "Go: 1.24"
          echo "Gradle: 8.7"
          echo "Android API: 34"
          echo "Android NDK: 27.2.12479018"
          echo "Hysteria: $HYST_TAG"
          echo "=================================="
