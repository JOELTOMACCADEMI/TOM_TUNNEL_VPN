
name: Build TOM TUNNEL APK

on:
  push:
    branches: [main, master]
    tags: ['v*']

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      XRAY_VERSION: '26.11.9'
      HYST_TAG: 'v1.3.5'
      ANDROID_API: '34'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            unzip \
            git \
            zip \
            file \
            binutils \
            build-essential \
            ca-certificates

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          go version
          gradle --version
          sdkmanager --version

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f script/bootstrap-engines.sh

      - name: Validate engine script
        shell: bash
        run: |
          set -euo pipefail

          chmod +x script/bootstrap-engines.sh

          bash -n script/bootstrap-engines.sh

          echo "Bootstrap syntax OK"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: tom-go-${{ runner.os }}-${{ hashFiles('script/bootstrap-engines.sh') }}
          restore-keys: |
            tom-go-${{ runner.os }}-

      - name: Prepare engine directories
        run: |
          set -euo pipefail

          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

      - name: Build VPN native engines
        shell: bash
        run: |
          set -euo pipefail

          export XRAY_VERSION="${XRAY_VERSION}"
          export HYST_TAG="${HYST_TAG}"

          bash script/bootstrap-engines.sh

      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "app/libs/hev-socks5-tunnel.aar"

            "app/src/main/jniLibs/arm64-v8a/libxray.so"
            "app/src/main/jniLibs/arm64-v8a/libdnstt.so"
            "app/src/main/jniLibs/arm64-v8a/libhysteria.so"

            "app/src/main/jniLibs/x86_64/libxray.so"
            "app/src/main/jniLibs/x86_64/libdnstt.so"
            "app/src/main/jniLibs/x86_64/libhysteria.so"
          )

          for f in "${FILES[@]}"; do
            test -s "$f" || {
              echo "ERROR: Missing $f"
              exit 1
            }
            echo "OK: $f"
          done

      - name: Validate native architectures
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do

              FILE="app/src/main/jniLibs/${ABI}/lib${ENGINE}.so"

              file "$FILE"
              readelf -h "$FILE" >/dev/null

            done
          done

      - name: Build TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --max-workers=2 \
              :app:clean \
              :app:assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --max-workers=2 \
              :app:clean \
              :app:assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK"

          echo "APK generated successfully"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n \
            's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -n1)

          VERSION="${VERSION:-dev}"

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "TOM_TUNNEL-${VERSION}-debug.apk"

          ls -lh TOM_TUNNEL-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-APK
          path: TOM_TUNNEL-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TOM_TUNNEL-*-debug.apk

      - name: Build summary
        if: always()
        run: |
          echo "=================================="
          echo "       TOM TUNNEL BUILD"
          echo "=================================="
          echo "Java: 17"
          echo "Android API: 34"
          echo "Xray: $XRAY_VERSION"
          echo "Hysteria: $HYST_TAG"
          echo "=================================="
