
name: Compile TOM TUNNEL Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip jq \
            build-essential binutils \
            python3

      - name: Validate source files
        run: |
          set -e
          test -f script/bootstrap-engines.sh
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      # FIX EXACT HYSTERIA PATH
      - name: Patch Hysteria source path
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("script/bootstrap-engines.sh")
          s = p.read_text()

          old = '''      cd "$HYST_SRC"

      GOOS="$goos" \\
      GOARCH="$goarch" \\
      CGO_ENABLED=0 \\
      go build'''

          new = '''      cd "$HYST_SRC/app"

      GOOS="$goos" \\
      GOARCH="$goarch" \\
      CGO_ENABLED=0 \\
      go build'''

          if old not in s:
              raise SystemExit(
                  "ERROR: Expected Hysteria build block not found. "
                  "Refusing to apply an unsafe patch."
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("Hysteria path corrected successfully.")
          PY

          grep -A35 'build_hysteria()' script/bootstrap-engines.sh

      # BUILD NATIVE ENGINES
      - name: Build VPN engines
        shell: bash
        env:
          HYST_TAG: v1.3.5
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          chmod +x script/bootstrap-engines.sh

          bash script/bootstrap-engines.sh

      # VALIDATE ENGINES
      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            DIR="app/src/main/jniLibs/$ABI"

            for ENGINE in xray dnstt hysteria; do
              FILE="$DIR/lib$ENGINE.so"

              test -s "$FILE"
              file "$FILE"
              readelf -h "$FILE"
            done
          done

          test -s app/libs/hev-socks5-tunnel.aar

      # BUILD APK
      - name: Compile TOM TUNNEL APK
        run: |
          set -euo pipefail

          gradle --no-daemon \
            --stacktrace \
            :app:clean \
            :app:assembleDebug

      # VERIFY APK
      - name: Verify APK
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK"

      # PREPARE APK
      - name: Prepare release files
        run: |
          set -euo pipefail

          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
            release/TOM-TUNNEL.apk

          sha256sum release/TOM-TUNNEL.apk \
            > release/SHA256SUMS.txt

      # UPLOAD
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # GITHUB RELEASE
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
