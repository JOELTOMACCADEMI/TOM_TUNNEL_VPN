name: Build TOM TUNNEL Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      HYST_TAG: v1.3.5
      ANDROID_API: "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Go 1.24 is required by the DNSTT build.
      - name: Set up Go 1.24 for DNSTT
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/27.2.12479018"

      # IMPORTANT: bootstrap-engines.sh refuses to build Hysteria without Go 1.20.14.
      - name: Install Go 1.20.14 for Hysteria
        shell: bash
        run: |
          set -euo pipefail
          GO_DIR="$RUNNER_TEMP/go1.20.14"
          mkdir -p "$GO_DIR"
          curl -fL --retry 5 --retry-all-errors \
            https://go.dev/dl/go1.20.14.linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/go1.20.14.tar.gz"
          tar -xzf "$RUNNER_TEMP/go1.20.14.tar.gz" \
            -C "$GO_DIR" --strip-components=1
          "$GO_DIR/bin/go" version
          echo "HYST_GO=$GO_DIR/bin/go" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl git jq unzip zip file binutils build-essential python3

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          go version
          "$HYST_GO" version
          test -d "$ANDROID_NDK_HOME"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f script/bootstrap-engines.sh
          echo "Build environment ready."

      - name: Prepare native output directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          chmod +x script/bootstrap-engines.sh

      - name: Build VPN native engines
        shell: bash
        run: |
          set -euo pipefail
          bash script/bootstrap-engines.sh

      - name: Verify native engines
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do
              FILE="app/src/main/jniLibs/${ABI}/lib${ENGINE}.so"
              test -s "$FILE"
              file "$FILE"
              readelf -h "$FILE" >/dev/null
              echo "Verified: $FILE"
            done
          done
          test -s app/libs/hev-socks5-tunnel.aar
          unzip -t app/libs/hev-socks5-tunnel.aar >/dev/null

      - name: Compile TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --max-workers=2 \
            :app:clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          "${ANDROID_HOME}/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 10

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/TOM-TUNNEL.apk
          sha256sum release/TOM-TUNNEL.apk > release/SHA256SUMS.txt

      - name: Upload TOM TUNNEL APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-ANDROID-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TOM TUNNEL Android build"
            echo ""
            echo "- Java: 17"
            echo "- DNSTT Go: 1.24.x"
            echo "- Hysteria Go: 1.20.14"
            echo "- Gradle: 8.7"
            echo "- Android API: 34"
            echo "- Android NDK: 27.2.12479018"
            echo "- Hysteria: ${HYST_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
