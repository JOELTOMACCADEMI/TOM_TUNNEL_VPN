name: Build TOM TUNNEL Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      HYST_TAG: v1.3.5
      ANDROID_API: "24"
      XRAY_VERSION: "26.11.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform, build-tools and NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Install Go 1.20.14 for Hysteria
        shell: bash
        run: |
          set -Eeuo pipefail
          GO_DIR="$RUNNER_TEMP/go1.20.14"
          mkdir -p "$GO_DIR"
          curl -fL --retry 5 --retry-all-errors \
            https://go.dev/dl/go1.20.14.linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/go1.20.14.tar.gz"
          tar -xzf "$RUNNER_TEMP/go1.20.14.tar.gz" \
            -C "$GO_DIR" --strip-components=1
          "$GO_DIR/bin/go" version
          echo "HYST_GO=$GO_DIR/bin/go" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl git jq unzip zip file binutils build-essential

      - name: Verify build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          java -version
          go version
          "$HYST_GO" version
          gradle --version
          test -d "$ANDROID_NDK_HOME"
          test -f script/bootstrap-engines.sh
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${ANDROID_API}-clang"

      - name: Prepare native output directories
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          chmod +x script/bootstrap-engines.sh

      # GITHUB_TOKEN réduit les refus 403 dus aux limites de l'API GitHub.
      - name: Build Xray, DNSTT, Hysteria and HEV engines
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash script/bootstrap-engines.sh

      - name: Verify native engines and architectures
        shell: bash
        run: |
          set -Eeuo pipefail
          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do
              FILE="app/src/main/jniLibs/$ABI/lib$ENGINE.so"
              test -s "$FILE"
              echo "Verified: $FILE"
              file "$FILE"
              readelf -h "$FILE" >/dev/null
            done
          done
          test -s app/libs/hev-socks5-tunnel.aar
          unzip -t app/libs/hev-socks5-tunnel.aar >/dev/null

      - name: Enable AndroidX
        shell: bash
        run: |
          set -Eeuo pipefail
          touch gradle.properties
          if grep -qE '^android\.useAndroidX=' gradle.properties; then
            sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            printf '\nandroid.useAndroidX=true\n' >> gradle.properties
          fi
          if ! grep -qE '^android\.enableJetifier=' gradle.properties; then
            printf 'android.enableJetifier=true\n' >> gradle.properties
          fi
          grep -E '^android\.(useAndroidX|enableJetifier)=' gradle.properties

      - name: Compile TOM TUNNEL debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --max-workers=2 \
            --no-build-cache \
            :app:clean \
            :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p release
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" \
            > release/apk-badging.txt
          sed -n '1,12p' release/apk-badging.txt
          cp "$APK" "release/TOM-TUNNEL-${GITHUB_SHA::7}-debug.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload TOM TUNNEL APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-ANDROID-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Upload Gradle diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-BUILD-DIAGNOSTICS
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TOM TUNNEL Android build"
            echo ""
            echo "- Java: 17"
            echo "- Gradle: 8.7"
            echo "- DNSTT Go: 1.24"
            echo "- Hysteria Go: 1.20.14"
            echo "- Hysteria tag: $HYST_TAG"
            echo "- Xray: $XRAY_VERSION"
            echo "- Android API: 34"
            echo "- NDK: 27.2.12479018"
          } >> "$GITHUB_STEP_SUMMARY"
