
name: Build TOM TUNNEL Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TOM TUNNEL APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. Download project
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Java 17
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Go compiler
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      # 5. Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 6. Validate project
      - name: Validate project structure
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f script/bootstrap-engines.sh

          echo "Project structure validated."

      # 7. FIX HYSTERIA COMPILER
      - name: Fix Hysteria v1 build paths
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("script/bootstrap-engines.sh")
          s = p.read_text()

          marker = 'build_hysteria(){'

          if marker not in s:
              raise SystemExit("Hysteria build function not found")

          before, after = s.split(marker, 1)

          old_path = 'cd "$HYST_SRC" &&'
          new_path = 'cd "$HYST_SRC/app" &&'

          if old_path not in after:
              raise SystemExit("Hysteria source path not found")

          after = after.replace(old_path, new_path, 1)

          old_loop = 'for goos in android linux; do'

          if old_loop not in after:
              raise SystemExit("Hysteria OS build loop not found")

          after = after.replace(
              old_loop,
              'for goos in linux; do',
              1
          )

          p.write_text(before + marker + after)

          print("Hysteria build path corrected.")
          print("Static Linux Go compilation enabled.")
          PY

          grep -A25 'build_hysteria(){' script/bootstrap-engines.sh

      # 8. Build VPN native engines
      - name: Build VPN native engines
        shell: bash
        env:
          HYST_TAG: v1.3.5
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail

          chmod +x script/bootstrap-engines.sh

          bash script/bootstrap-engines.sh

          echo "Native engines successfully prepared."

          find app/src/main/jniLibs \
            -maxdepth 2 -type f -print

          test -s app/libs/hev-socks5-tunnel.aar
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so
          test -s app/src/main/jniLibs/arm64-v8a/libdnstt.so
          test -s app/src/main/jniLibs/arm64-v8a/libhysteria.so

      # 9. Validate native architectures
      - name: Validate native architectures
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            DIR="app/src/main/jniLibs/$ABI"

            test -s "$DIR/libxray.so"
            test -s "$DIR/libdnstt.so"
            test -s "$DIR/libhysteria.so"

            echo "Validated ABI: $ABI"
          done

      # 10. Build APK
      - name: Build TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            --stacktrace \
            :app:clean \
            :app:assembleDebug

      # 11. Verify APK
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully generated."

          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK" | head -n 10

      # 12. Prepare APK
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n \
            's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -n 1)

          VERSION="${VERSION:-1.0.0}"

          mkdir -p release-apk

          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-apk/TOM-TUNNEL-${VERSION}.apk"

          sha256sum release-apk/*.apk \
            > release-apk/SHA256SUMS.txt

      # 13. Upload APK
      - name: Upload TOM TUNNEL APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-ANDROID-APK
          path: release-apk/*
          if-no-files-found: error
          retention-days: 30

      # 14. Publish GitHub Release on version tags
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*
          generate_release_notes: true
