name: Build TOM TUNNEL APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Détecte automatiquement si le projet Android est à la racine
      # ou dans le sous-dossier TomTunnel/ (structure du ZIP fourni).
      - name: Détecter le dossier du projet
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ] && [ -f "$GITHUB_WORKSPACE/scripts/bootstrap-engines.sh" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "$GITHUB_WORKSPACE/TomTunnel/app/build.gradle.kts" ] && [ -f "$GITHUB_WORKSPACE/TomTunnel/scripts/bootstrap-engines.sh" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/TomTunnel"
          else
            echo "::error::Projet introuvable : app/build.gradle.kts ou scripts/bootstrap-engines.sh absent."
            echo "Contenu du dépôt :"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet détecté : $PROJECT_DIR"
          test -s "$PROJECT_DIR/scripts/bootstrap-engines.sh"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache des moteurs natifs
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
            TomTunnel/app/libs
            TomTunnel/app/src/main/jniLibs
          key: tomtunnel-engines-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-engines.sh', 'TomTunnel/scripts/bootstrap-engines.sh') }}

      - name: Télécharger et compiler les moteurs
        if: steps.engines.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x scripts/bootstrap-engines.sh
          bash scripts/bootstrap-engines.sh

      - name: Vérifier les moteurs
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          test -s app/libs/hev-socks5-tunnel.aar || {
            echo "::error::AAR hev-socks5-tunnel.aar manquant"
            exit 1
          }
          for abi in arm64-v8a x86_64; do
            for lib in libxray.so libdnstt.so libhysteria.so; do
              test -s "app/src/main/jniLibs/$abi/$lib" || {
                echo "::error::Moteur manquant : $abi/$lib"
                exit 1
              }
            done
          done
          echo "Tous les moteurs attendus sont présents."

      - name: Configurer le chemin Android SDK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Compiler l'APK debug
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Compiler l'APK release signé
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tomtunnel.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/tomtunnel.jks" \
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Préparer les APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION="${VERSION:-1.0.0}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/TomTunnel-$VERSION-debug.apk"
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist/TomTunnel-$VERSION-release.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Publier les APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: TomTunnel-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier dans GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
