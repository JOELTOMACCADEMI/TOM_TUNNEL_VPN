
name: Build TOM TUNNEL APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      JAVA_VERSION: '17'
      GRADLE_VERSION: '8.7'
      ANDROID_API: '34'
      BUILD_TOOLS: '34.0.0'
      XRAY_VERSION: '26.11.9'
      HYST_TAG: 'v1.3.5'

    steps:

      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. Install Android packages
      # IMPORTANT: Do not use yes | sdkmanager --licenses
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

          echo "Android SDK successfully installed."

      # 6. Install system dependencies
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            unzip \
            git \
            zip \
            file \
            binutils \
            build-essential \
            ca-certificates \
            python3

      # 7. Install Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8. Check environment
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          go version
          gradle --version
          sdkmanager --version
          adb version

          echo "Build environment OK"

      # 9. Check project
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f script/bootstrap-engines.sh

          echo "Project structure verified"

      # 10. Repair bootstrap script
      - name: Repair bootstrap engines script
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("script/bootstrap-engines.sh")
          lines = path.read_text().splitlines()

          fixed = {
              "ROOT": False,
              "REL": False,
              "XRAY": False,
          }

          for i, line in enumerate(lines):

              if line.startswith("ROOT="):
                  lines[i] = (
                      'ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"'
                  )
                  fixed["ROOT"] = True

              elif line.startswith("REL="):
                  lines[i] = (
                      'REL="${CLIENT_DIR#"$MOD_DIR"}"; REL="${REL#/}"'
                  )
                  fixed["REL"] = True

              elif line.startswith("XRAY="):
                  lines[i] = "XRAY=26.11.9"
                  fixed["XRAY"] = True

          missing = [key for key, value in fixed.items() if not value]

          if missing:
              raise SystemExit(
                  "Required variables not found: " + ", ".join(missing)
              )

          path.write_text("\n".join(lines) + "\n")

          print("ROOT corrected")
          print("REL corrected")
          print("XRAY updated to 26.11.9")
          PY

          chmod +x script/bootstrap-engines.sh

          bash -n script/bootstrap-engines.sh

          echo "Bootstrap script syntax verified"

      # 11. Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: tom-go-${{ runner.os }}-${{ hashFiles('script/bootstrap-engines.sh') }}
          restore-keys: |
            tom-go-${{ runner.os }}-

      # 12. Prepare directories
      - name: Prepare engine directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

      # 13. Build native engines
      - name: Build VPN native engines
        shell: bash
        run: |
          set -euo pipefail

          export XRAY_VERSION="$XRAY_VERSION"
          export HYST_TAG="$HYST_TAG"

          bash -n script/bootstrap-engines.sh

          bash script/bootstrap-engines.sh

      # 14. Validate native engines
      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "app/libs/hev-socks5-tunnel.aar"

            "app/src/main/jniLibs/arm64-v8a/libxray.so"
            "app/src/main/jniLibs/arm64-v8a/libdnstt.so"
            "app/src/main/jniLibs/arm64-v8a/libhysteria.so"

            "app/src/main/jniLibs/x86_64/libxray.so"
            "app/src/main/jniLibs/x86_64/libdnstt.so"
            "app/src/main/jniLibs/x86_64/libhysteria.so"
          )

          for f in "${FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Missing engine: $f"
              exit 1
            fi

            echo "OK: $f"
          done

          unzip -t app/libs/hev-socks5-tunnel.aar

      # 15. Validate architectures
      - name: Validate native architectures
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do

              FILE="app/src/main/jniLibs/${ABI}/lib${ENGINE}.so"

              file "$FILE"
              readelf -h "$FILE" >/dev/null

              echo "Validated $FILE"

            done
          done

      # 16. Build APK
      - name: Build TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:clean \
            :app:assembleDebug

      # 17. Verify APK
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          unzip -t "$APK"

          echo "APK successfully generated"

      # 18. Prepare APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n \
            's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -n1)

          VERSION="${VERSION:-dev}"

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "TOM_TUNNEL-${VERSION}-debug.apk"

          ls -lh TOM_TUNNEL-*.apk

      # 19. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-APK
          path: TOM_TUNNEL-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 20. Publish release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TOM_TUNNEL-*-debug.apk

      # 21. Build report
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "===================================="
          echo "       TOM TUNNEL BUILD REPORT"
          echo "===================================="
          echo "Java: $JAVA_VERSION"
          echo "Gradle: $GRADLE_VERSION"
          echo "Android API: $ANDROID_API"
          echo "Xray: $XRAY_VERSION"
          echo "Hysteria: $HYST_TAG"
          echo "===================================="
