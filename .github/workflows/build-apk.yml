
name: Build TOM TUNNEL APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      JAVA_VERSION: '17'
      ANDROID_API: '34'
      BUILD_TOOLS: '34.0.0'
      HYST_TAG: 'v1.3.5'

    steps:

      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. Android packages
      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          sdkmanager --licenses

      # 6. Dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip git zip file binutils \
            build-essential ca-certificates

      # 7. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8. Check environment
      - name: Verify environment
        run: |
          set -e
          java -version
          go version
          gradle --version
          sdkmanager --version

      # 9. Verify source
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f script/bootstrap-engines.sh

          echo "Project structure OK"

      # 10. FIX CORRUPTED ENGINE SCRIPT
      - name: Repair bootstrap engines script
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("script/bootstrap-engines.sh")
          lines = p.read_text().splitlines()

          fixed_root = False
          fixed_rel = False

          for i, line in enumerate(lines):

              if line.startswith("ROOT="):
                  lines[i] = 'ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"'
                  fixed_root = True

              if line.startswith("REL="):
                  lines[i] = 'REL="${CLIENT_DIR#"$MOD_DIR"}"; REL="${REL#/}"'
                  fixed_rel = True

          if not fixed_root or not fixed_rel:
              raise SystemExit(
                  f"Cannot repair script safely: ROOT={fixed_root}, REL={fixed_rel}"
              )

          p.write_text("\n".join(lines) + "\n")
          print("ROOT and REL syntax repaired.")
          PY

          chmod +x script/bootstrap-engines.sh

          bash -n script/bootstrap-engines.sh

          echo "Bootstrap script syntax OK"

      # 11. Prepare directories
      - name: Prepare engine directories
        run: |
          set -euo pipefail

          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

      # 12. Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: tom-go-${{ runner.os }}-${{ hashFiles('script/bootstrap-engines.sh') }}
          restore-keys: |
            tom-go-${{ runner.os }}-

      # 13. Compile engines
      - name: Build VPN native engines
        shell: bash
        run: |
          set -euo pipefail

          export HYST_TAG="v1.3.5"

          bash -n script/bootstrap-engines.sh

          bash script/bootstrap-engines.sh

      # 14. Validate engines
      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "app/libs/hev-socks5-tunnel.aar"

            "app/src/main/jniLibs/arm64-v8a/libxray.so"
            "app/src/main/jniLibs/arm64-v8a/libdnstt.so"
            "app/src/main/jniLibs/arm64-v8a/libhysteria.so"

            "app/src/main/jniLibs/x86_64/libxray.so"
            "app/src/main/jniLibs/x86_64/libdnstt.so"
            "app/src/main/jniLibs/x86_64/libhysteria.so"
          )

          for f in "${FILES[@]}"; do
            test -s "$f" || {
              echo "Missing engine: $f"
              exit 1
            }

            echo "OK: $f"
          done

          unzip -t app/libs/hev-socks5-tunnel.aar

      # 15. Validate architectures
      - name: Validate native architectures
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do

              FILE="app/src/main/jniLibs/${ABI}/lib${ENGINE}.so"

              file "$FILE"
              readelf -h "$FILE" >/dev/null

            done
          done

      # 16. Compile APK
      - name: Build TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --max-workers=2 \
              :app:clean \
              :app:assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --max-workers=2 \
              :app:clean \
              :app:assembleDebug
          fi

      # 17. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK"

          echo "APK compilation successful"

      # 18. Rename APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n \
            's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -n1)

          VERSION="${VERSION:-dev}"

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "TOM_TUNNEL-${VERSION}-debug.apk"

          ls -lh TOM_TUNNEL-*.apk

      # 19. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-APK
          path: TOM_TUNNEL-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 20. Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TOM_TUNNEL-*-debug.apk

      # 21. Summary
      - name: Build summary
        if: always()
        run: |
          echo "================================"
          echo "       TOM TUNNEL BUILD"
          echo "================================"
          echo "Java: 17"
          echo "Android API: 34"
          echo "Hysteria: $HYST_TAG"
          echo "================================"
