
name: Build TOM TUNNEL APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tom-tunnel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile TOM TUNNEL Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      JAVA_VERSION: '17'
      GRADLE_VERSION: '8.7'
      ANDROID_API: '34'
      BUILD_TOOLS: '34.0.0'
      HYST_TAG: 'v1.3.5'

    steps:

      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Verify project
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f script/bootstrap-engines.sh

          echo "Project structure OK"

      # 3. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 6. Verify Android SDK
      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          go version
          sdkmanager --version
          adb version

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "Android environment OK"

      # 7. Install native build dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            git \
            zip \
            file \
            binutils \
            build-essential \
            ca-certificates

      # 8. Setup Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 9. Verify Gradle
      - name: Verify Gradle
        run: |
          gradle --version

      # 10. Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: tom-go-${{ runner.os }}-${{ hashFiles('script/bootstrap-engines.sh') }}
          restore-keys: |
            tom-go-${{ runner.os }}-

      # 11. Prepare native engines
      - name: Prepare engine environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

          chmod +x script/bootstrap-engines.sh

          go env

      # 12. Download and compile VPN engines
      - name: Build VPN native engines
        shell: bash
        run: |
          set -euo pipefail

          export HYST_TAG="${HYST_TAG}"

          bash script/bootstrap-engines.sh

      # 13. Validate native engines
      - name: Validate VPN engines
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "app/libs/hev-socks5-tunnel.aar"

            "app/src/main/jniLibs/arm64-v8a/libxray.so"
            "app/src/main/jniLibs/arm64-v8a/libdnstt.so"
            "app/src/main/jniLibs/arm64-v8a/libhysteria.so"

            "app/src/main/jniLibs/x86_64/libxray.so"
            "app/src/main/jniLibs/x86_64/libdnstt.so"
            "app/src/main/jniLibs/x86_64/libhysteria.so"
          )

          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: Missing file: $f"
              exit 1
            fi

            echo "OK: $f"
          done

          unzip -t app/libs/hev-socks5-tunnel.aar

      # 14. Validate CPU architectures
      - name: Validate native architectures
        shell: bash
        run: |
          set -euo pipefail

          for ABI in arm64-v8a x86_64; do
            for ENGINE in xray dnstt hysteria; do

              FILE="app/src/main/jniLibs/${ABI}/lib${ENGINE}.so"

              echo "Checking $FILE"

              file "$FILE"
              readelf -h "$FILE"

            done
          done

      # 15. Compile Android APK
      - name: Build TOM TUNNEL APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:clean \
            :app:assembleDebug

      # 16. Verify generated APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          unzip -t "$APK"

          echo "APK successfully generated"

      # 17. Rename APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n \
            's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -n1)

          VERSION="${VERSION:-dev}"

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "TOM_TUNNEL-${VERSION}-debug.apk"

          ls -lh TOM_TUNNEL-*.apk

      # 18. Upload APK
      - name: Upload TOM TUNNEL APK
        uses: actions/upload-artifact@v4
        with:
          name: TOM-TUNNEL-APK
          path: TOM_TUNNEL-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 19. Publish GitHub Release
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TOM_TUNNEL-*-debug.apk

      # 20. Build report
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "=================================="
          echo "       TOM TUNNEL APK"
          echo "=================================="
          echo "Java: 17"
          echo "Gradle: 8.7"
          echo "Android API: 34"
          echo "Hysteria: ${HYST_TAG}"
          echo "=================================="
